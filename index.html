<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Anima Vena · AR</title>
  <meta name="theme-color" content="#0b0d2a">
  <!-- 8th Wall self-hosted engine; 'slam' chunk contains image-target tracking -->
  <script src="vendor/8thwall/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
    } }
  </script>
  <style>
    :root { --ink:#f3efff; --deep:#0b0d2a; --accent:#ff3d86; }
    html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); }
    #camerafeed { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
    .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px; background:radial-gradient(circle at 50% 40%, #2a2470 0%, var(--deep) 70%); transition:opacity .4s; z-index:10; }
    .overlay.hidden { opacity:0; pointer-events:none; }
    .overlay h1 { font-weight:300; letter-spacing:.3em; font-size:20px; margin:0; }
    .overlay p { max-width:320px; line-height:1.5; margin:0; opacity:.85; }
    button { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--ink); border-radius:999px; padding:12px 28px; letter-spacing:.15em; }
    #hint { position:fixed; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom)); text-align:center; z-index:5; pointer-events:none; transition:opacity .4s; }
    #hint span { background:rgba(11,13,42,.6); padding:10px 18px; border-radius:999px; font-size:14px; }
    #hint.hidden { opacity:0; }
    #error { color:#ffb3c8; }
  </style>
</head>
<body>
  <canvas id="camerafeed"></canvas>

  <div id="intro" class="overlay">
    <h1>ANIMA VENA</h1>
    <p>Point your camera at the painting to bring it to life.</p>
    <button id="start" disabled>LOADING…</button>
    <p id="error"></p>
  </div>

  <div id="hint" class="hidden"><span>Point at the painting</span></div>

  <script type="module" src="app.js?v=6"></script>
</body>
</html>
