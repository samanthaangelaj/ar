<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Anima Vena · AR</title>
  <meta name="theme-color" content="#0a0a12">
  <!-- Store fonts: Cormorant Garamond (headings), Cinzel (labels/nav), Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <!-- 8th Wall self-hosted engine; 'slam' chunk contains image-target tracking -->
  <script src="vendor/8thwall/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
    } }
  </script>
  <style>
    /* Anima Vena design tokens (from the Shopify theme) */
    :root {
      --color-void: #0a0a12;
      --color-divine: #ffffff;
      --color-celestial: #1a0a3e;
      --color-nebula: #6b21a8;
      --color-aurora: #f97316;
      --color-sacred: #ec4899;
      --color-mystic: #818cf8;
      --color-gold: #fbbf24;
      --font-heading: "Cormorant Garamond", Georgia, serif;
      --font-sub: "Cinzel", Georgia, serif;
      --font-body: "Inter", system-ui, sans-serif;
      --text-xs: 0.6875rem; --text-sm: 0.8125rem; --text-xl: 1.25rem; --text-4xl: 2.25rem;
      --header-height: 4.5rem;
      --page-margin: 24px;
    }
    html, body { margin:0; height:100%; background:var(--color-void); overflow:hidden; font-family:var(--font-body); font-weight:300; color:var(--color-divine); }
    #camerafeed { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
    a { color:inherit; }

    /* ---------- header (mirrors sections/header.liquid) ---------- */
    .header {
      position:fixed; top:0; left:0; right:0; z-index:200;
      display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1.5rem;
      height:var(--header-height); padding:env(safe-area-inset-top) var(--page-margin) 0;
      background:var(--color-void);
      border-bottom:1px solid color-mix(in oklch, var(--color-celestial) 60%, transparent);
      transition:background .4s;
    }
    body.ar-live .header { background:color-mix(in oklch, var(--color-void) 55%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    .header__left, .header__right { display:flex; align-items:center; gap:2rem; }
    .header__left { justify-self:start; } .header__right { justify-self:end; }
    .header__nav { display:flex; align-items:center; gap:2rem; }
    .header__link {
      font-family:var(--font-sub); font-size:var(--text-xs); letter-spacing:.15em; text-transform:uppercase;
      text-decoration:none; color:var(--color-divine); opacity:.55; transition:opacity .2s; white-space:nowrap;
    }
    .header__link:hover { opacity:1; }
    .header__logo { display:flex; justify-self:center; }
    .header__logo img { height:1.6rem; width:auto; display:block; }
    .header__icon-btn { display:flex; color:var(--color-divine); opacity:.7; transition:opacity .2s; }
    .header__icon-btn:hover { opacity:1; }
    .header svg { width:1.375rem; height:1.375rem; --icon-stroke-width:1.2; }
    .header__hamburger { display:none; flex-direction:column; justify-content:center; gap:.3125rem; background:none; border:0; padding:.375rem; cursor:pointer; color:var(--color-divine); }
    .header__hamburger span { display:block; width:1.375rem; height:1px; background:currentColor; }

    /* mobile menu */
    .mobile-nav { position:fixed; inset:0; width:100%; height:100%; max-width:100%; max-height:100%; border:0; padding:0; margin:0; background:var(--color-void); color:var(--color-divine); z-index:300; }
    .mobile-nav::backdrop { background:transparent; }
    .mobile-nav__inner { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%; gap:2rem; padding:var(--header-height) var(--page-margin) 3rem; box-sizing:border-box; }
    .mobile-nav__close { position:absolute; top:calc(var(--header-height) / 2 + env(safe-area-inset-top)); right:var(--page-margin); transform:translateY(-50%); background:none; border:0; color:var(--color-divine); opacity:.7; padding:.375rem; cursor:pointer; }
    .mobile-nav__close svg { width:1.5rem; height:1.5rem; }
    .mobile-nav__links { display:flex; flex-direction:column; align-items:center; gap:1.75rem; }
    .mobile-nav__link { font-family:var(--font-sub); font-size:var(--text-xl); letter-spacing:.2em; text-transform:uppercase; text-decoration:none; opacity:.65; }
    .mobile-nav__link:hover { opacity:1; }
    .mobile-nav__link--current { opacity:1; color:var(--color-mystic); }

    @media (max-width: 768px) {
      .header { grid-template-columns:auto 1fr auto; }
      .header__nav { display:none; }
      .header__hamburger { display:flex; }
      .header__logo img { height:1.35rem; }
    }

    /* ---------- intro ---------- */
    .overlay {
      position:fixed; inset:0; z-index:10; box-sizing:border-box;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem;
      text-align:center; padding:calc(var(--header-height) + 2rem) var(--page-margin) 2rem;
      /* Ref. 2 background gradient */
      background: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(10,10,18,1) 0%, rgba(10,12,60,.9) 55%, rgba(10,17,114,.8) 80%, rgba(0,42,102,1) 100%);
      transition:opacity .5s;
    }
    .overlay.hidden { opacity:0; pointer-events:none; }
    .label { font-family:var(--font-sub); font-size:var(--text-xs); letter-spacing:.3em; text-transform:uppercase; color:var(--color-mystic); margin:0; }
    .intro__title { font-family:var(--font-heading); font-style:italic; font-weight:300; font-size:var(--text-4xl); line-height:1.15; margin:0; }
    .intro__thumb { width:min(46vw, 190px); aspect-ratio:3/4; object-fit:cover; border:1px solid color-mix(in oklch, var(--color-mystic) 45%, transparent); box-shadow:0 0 40px color-mix(in oklch, var(--color-nebula) 55%, transparent); }
    .intro__text { max-width:300px; font-size:.95rem; line-height:1.8; opacity:.7; margin:0; }
    .btn {
      font-family:var(--font-sub); font-size:var(--text-sm); letter-spacing:.25em; text-transform:uppercase;
      color:var(--color-divine); background:transparent; border:1px solid color-mix(in oklch, var(--color-divine) 70%, transparent);
      border-radius:2px; padding:.95rem 2.4rem; cursor:pointer; transition:background .25s, border-color .25s;
    }
    .btn:not(:disabled):hover { background:color-mix(in oklch, var(--color-mystic) 20%, transparent); border-color:var(--color-mystic); }
    .btn:disabled { opacity:.5; }
    #error { color:#ffb3c8; font-size:var(--text-sm); margin:0; }
    #error:empty { display:none; }

    /* ---------- scanning hint ---------- */
    #hint { position:fixed; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom)); text-align:center; z-index:5; pointer-events:none; transition:opacity .4s; }
    #hint span { display:inline-block; font-family:var(--font-sub); font-size:var(--text-xs); letter-spacing:.25em; text-transform:uppercase; background:color-mix(in oklch, var(--color-void) 65%, transparent); padding:.8rem 1.4rem; border:1px solid color-mix(in oklch, var(--color-mystic) 40%, transparent); }
    #hint.hidden { opacity:0; }
  </style>
</head>
<body>
  <canvas id="camerafeed"></canvas>

  <!-- Header: same layout and links as the store. SITE = store root URL. -->
  <header class="header" role="banner">
    <div class="header__left">
      <button class="header__hamburger" aria-label="Open menu" aria-controls="mobile-nav" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="header__nav" aria-label="Primary"></nav>
    </div>
    <a class="header__logo" data-href="/" aria-label="Anima Vena"><img src="img/logo.png" alt="Anima Vena" width="720" height="129"></a>
    <div class="header__right">
      <nav class="header__nav" aria-label="Primary (continued)"></nav>
      <a class="header__icon-btn" data-href="/cart" aria-label="Cart">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="var(--icon-stroke-width)" d="M3.392 6.875h13.216v8.016c0 .567-.224 1.112-.624 1.513-.4.402-.941.627-1.506.627H5.522a2.13 2.13 0 0 1-1.506-.627 2.15 2.15 0 0 1-.624-1.513zM8.818 2.969h2.333c.618 0 1.211.247 1.649.686a2.35 2.35 0 0 1 .683 1.658v1.562H6.486V5.313c0-.622.246-1.218.683-1.658a2.33 2.33 0 0 1 1.65-.686"/></svg>
      </a>
    </div>
  </header>

  <dialog class="mobile-nav" id="mobile-nav">
    <div class="mobile-nav__inner">
      <button class="mobile-nav__close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <nav class="mobile-nav__links" aria-label="Mobile"></nav>
    </div>
  </dialog>

  <div id="intro" class="overlay">
    <p class="label">Augmented reality</p>
    <h1 class="intro__title">See the painting awaken</h1>
    <img class="intro__thumb" src="targets/painting_thumbnail.jpg" alt="The painting to scan">
    <p class="intro__text">Find this painting, press start and point your camera at it.</p>
    <button id="start" class="btn" disabled>Loading…</button>
    <p id="error"></p>
  </div>

  <div id="hint" class="hidden"><span>Point at the painting</span></div>

  <script>
    // ---- store navigation (edit here if the store menu changes) ----
    const SITE = 'https://animavenastudio.com'
    const NAV = [
      { title: 'Shop', path: '/pages/shop' },
      { title: 'Universe', path: '/pages/universe' },
      { title: 'FAQ', path: '/pages/faq' },
      { title: 'Contact', path: '/pages/contact' },
    ]
    const mk = (cls, { title, path }) => { const a = document.createElement('a'); a.className = cls; a.href = SITE + path; a.textContent = title; return a }
    const [navL, navR] = document.querySelectorAll('.header__nav')
    const half = Math.ceil(NAV.length / 2)
    NAV.forEach((l, i) => (i < half ? navL : navR).appendChild(mk('header__link', l)))
    NAV.forEach((l) => document.querySelector('.mobile-nav__links').appendChild(mk('mobile-nav__link', l)))
    document.querySelectorAll('[data-href]').forEach((a) => { a.href = SITE + a.dataset.href })

    const dlg = document.getElementById('mobile-nav'), burger = document.querySelector('.header__hamburger')
    burger.addEventListener('click', () => { dlg.showModal(); burger.setAttribute('aria-expanded', 'true') })
    dlg.querySelector('.mobile-nav__close').addEventListener('click', () => dlg.close())
    dlg.addEventListener('close', () => burger.setAttribute('aria-expanded', 'false'))
    document.getElementById('start').addEventListener('click', () => document.body.classList.add('ar-live'))
  </script>
  <script type="module" src="app.js?v=9"></script>
</body>
</html>
